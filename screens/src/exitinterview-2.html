<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="shot" content="width=844,height=390,scale=2">
<title>Exit Interview（合言葉）</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Yomogi&display=swap");
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 844px; height: 390px; overflow: hidden; background: #000; color: #E9E4D2; font-family: "Yomogi", "Noto Sans CJK JP", sans-serif; display: grid; place-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .title { font-size: 26px; color: #F0D98A; }
  .dim { color: #8D9796; font-size: 15px; }
  .field { width: 320px; background: #0F1719; border: 2px solid #F0D98A; border-radius: 6px; padding: 11px 14px; font-size: 18px; }
  .field i { display: inline-block; width: 2px; height: 20px; background: #F0D98A; vertical-align: -3px; margin-left: 2px; }
  .btn { background: #0F1719; border: 2px solid #6D7B7D; border-radius: 6px; padding: 9px 18px; font-size: 16px; }
  .btn.strong { border-color: #F0D98A; font-size: 18px; }
  .row { display: flex; gap: 12px; }
</style></head>
<body>
<div class="col">
  <div class="title">合言葉</div>
  <div class="dim">2人で同じ合言葉を入れると、同じ部屋につながります</div>
  <div class="field">あおいとびら<i></i></div>
  <div class="dim" style="font-size:13px">前と同じ合言葉なら、続きから遊べます</div>
  <div class="row"><div class="btn">戻る</div><div class="btn strong">つなぐ</div></div>
</div>
</body></html>
