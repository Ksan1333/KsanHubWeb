<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="shot" content="width=390,height=844,scale=2">
<title>MediaRelay（Android 版）</title>
<script src="_photo.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #000; color: #fff; font: 14px/1.4 "Roboto", "Noto Sans CJK JP", sans-serif; position: relative; }
  .sb { height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 13px; font-weight: 600; }
  .top { padding: 6px 16px 4px; display: flex; align-items: center; gap: 10px; }
  .back { color: #AEAEB2; font-size: 15px; }
  .top .r { margin-left: auto; display: flex; gap: 8px; }
  .top .r span { height: 32px; padding: 0 12px; border-radius: 16px; background: #1C1C1E; display: grid; place-items: center; font-size: 13px; }
  h1 { font-size: 30px; font-weight: 700; padding: 0 16px; }
  .sub { color: #8E8E93; font-size: 13px; padding: 0 16px 10px; display: flex; gap: 6px; align-items: center; }
  .sub i { width: 7px; height: 7px; border-radius: 50%; background: #30D158; display: inline-block; }
  .crumb { margin: 0 14px 10px; height: 36px; border-radius: 12px; background: #1C1C1E; display: flex; align-items: center; gap: 6px; padding: 0 12px; color: #AEAEB2; font-size: 13px; }
  .crumb b { color: #fff; font-weight: 600; }
  .folders { margin: 0 14px 8px; background: #1C1C1E; border-radius: 14px; overflow: hidden; }
  .folders div { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #2C2C2E; }
  .folders div:last-child { border-bottom: 0; }
  .folders small { margin-left: auto; color: #8E8E93; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .grid div { aspect-ratio: 1; position: relative; overflow: hidden; }
  .grid .v::after { content: "▶ 動画"; position: absolute; right: 5px; bottom: 5px; font-size: 10.5px; background: rgba(0,0,0,.55); border-radius: 8px; padding: 0 6px; }
  .grid .sel::before { content: "✓"; position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font-size: 12px; font-weight: 700; z-index: 1; }
  .grid .sel { outline: 3px solid #fff; outline-offset: -3px; }
  .action { position: absolute; left: 14px; right: 14px; bottom: 100px; height: 50px; border-radius: 25px; background: linear-gradient(180deg, #FFFFFF, #D1D1D6); color: #000; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
  .nav { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; width: 280px; height: 62px; border-radius: 31px; background: rgba(44,44,46,.7); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(18px); display: flex; align-items: center; padding: 0 6px; box-shadow: 0 8px 26px rgba(0,0,0,.6); }
  .nav div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #AEAEB2; position: relative; }
  .nav .on { color: #fff; font-weight: 700; }
  .nav .on::before { content: ""; position: absolute; inset: -6px 6px; border-radius: 24px; background: rgba(255,255,255,.14); }
  .nav svg { width: 22px; height: 22px; }
</style></head>
<body>
<div class="sb"><span>10:24</span><span>▾ ▴ ▮</span></div>

</nav>

</body></html>
