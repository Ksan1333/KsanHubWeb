<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="shot" content="width=844,height=390,scale=2">
<title>Exit Interview（タイトル）</title>
<style>
  /* 文字はアプリと同じ Yomogi（OFL）。手元にないときは Google Fonts から読む */
  @import url("https://fonts.googleapis.com/css2?family=Yomogi&display=swap");
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 844px; height: 390px; overflow: hidden; background: #000; color: #E9E4D2; font-family: "Yomogi", "Noto Sans CJK JP", sans-serif; display: grid; place-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .title { font-size: 46px; color: #F0D98A; line-height: 1.2; }
  .dim { color: #8D9796; font-size: 15px; }
  .btn { background: #0F1719; border: 2px solid #6D7B7D; border-radius: 6px; padding: 9px 18px; text-align: center; font-size: 15px; }
  .btn.strong { border-color: #F0D98A; font-size: 20px; width: 180px; }
  .row { display: flex; gap: 12px; }
</style></head>
<body>
<div class="col">
  <div class="title">Exit Interview</div>
  <div class="dim">出られたら合格</div>
  <div style="height:6px"></div>
  <div class="btn strong">遊ぶ</div>
  <div class="btn" style="font-size:16px">続きから</div>
  <div class="row"><div class="btn">テスト部屋</div><div class="btn">設定</div></div>
</div>
</body></html>
