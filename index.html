<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KsanHub</title>
<meta name="description" content="Ksan1333 の自作アプリの一覧。アプリを開くと、その画面の例が見られます。">
<meta name="theme-color" content="#F4F5F8">
<meta property="og:title" content="KsanHub">
<meta property="og:description" content="Ksan1333 の自作アプリの一覧。アプリを開くと、その画面の例が見られます。">
<meta property="og:image" content="icons/hub.png">
<link rel="icon" href="icons/hub.png">
<link rel="stylesheet" href="assets/style.css">
<script defer src="data/catalog.js"></script>
<script defer src="data/screens.js"></script>
<script defer src="assets/app.js"></script>
</head>
<body>
<div class="page">
  <header class="top">
    <img class="hub-icon" src="icons/hub.png" alt="" width="44" height="44">
    <div class="top-text">
      <div class="title-row">
        <h1>KsanHub</h1>
        <span class="version-chip">Web</span>
      </div>
      <p class="sub" id="sub">読み込み中…</p>
    </div>
  </header>

  <section class="status" aria-label="この Web 版について">
    <span class="status-item"><i class="dot dot-blue"></i>見るだけの Web 版です（インストール・更新は PC 版・Android 版の KsanHub で）</span>
    <span class="status-item"><i class="dot dot-green"></i>画面の例のデータはすべて架空です</span>
  </section>

  <main id="list" class="list" aria-live="polite">
    <noscript><p class="note">この一覧を見るには JavaScript を有効にしてください。</p></noscript>
  </main>

  <footer class="foot">
    一覧は KsanHub（PC 版・Android 版）と同じ catalog.json から作っています ・
    <a href="https://github.com/Ksan1333/KsanHubWeb">この Web 版のリポジトリ</a>
  </footer>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-top">
    <div class="viewer-title" id="viewerTitle"></div>
    <button type="button" class="viewer-btn" id="viewerClose" aria-label="閉じる（Esc）">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="viewer-stage" id="viewerStage">
    <button type="button" class="viewer-nav prev" id="viewerPrev" aria-label="前の画面（←）">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img id="viewerImg" alt="">
    <button type="button" class="viewer-nav next" id="viewerNext" aria-label="次の画面（→）">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="viewer-caption" id="viewerCaption"></div>
</div>
</body>
</html>
